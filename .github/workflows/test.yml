name: Tester
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd server && npm install --omit=dev
      - name: Syntaxkoll av alla skript
        run: for f in js/*.js js/*/*.js server/*.js tests/e2e/*.js; do node --check "$f" || exit 1; done
      - name: Tester
        run: node --test tests/*.test.js

  # Startar hela spelet i en riktig webbläsare med en låtsas-Claude (tests/e2e/spela.js).
  webblasare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd server && npm install --omit=dev
      - run: cd tests/e2e && npm install
      - run: cd tests/e2e && npx playwright install --with-deps chromium
      - name: Spela
        run: cd tests/e2e && node spela.js
