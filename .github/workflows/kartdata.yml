# Hämtar OpenStreetMap-data för Vasa centrum (tools/centrum/osm-vasklot.json).
# Körs bara på grenen kartdata-hamta, eftersom Claudes arbetsmiljö inte når Overpass direkt.
name: Kartdata
on:
  push:
    branches: [kartdata-hamta]
permissions:
  contents: write
jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hämta från Overpass
        run: |
          Q='[out:json][timeout:120];(way(63.0865,21.5440,63.0985,21.5800);relation["building"](63.0865,21.5440,63.0985,21.5800);relation["type"="multipolygon"](63.0865,21.5440,63.0985,21.5800);node["natural"="tree"](63.0865,21.5440,63.0985,21.5800);node["amenity"](63.0865,21.5440,63.0985,21.5800);node["shop"](63.0865,21.5440,63.0985,21.5800);node["highway"](63.0865,21.5440,63.0985,21.5800);node["historic"](63.0865,21.5440,63.0985,21.5800););out geom;'
          set +e
          mkdir -p tools/centrum
          : > tools/centrum/hamtlogg.txt
          for i in 1 2 3 4 5 6; do
            for url in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter; do
              code=$(curl -s -m 180 -A "ArreSimulator/2.0 (github.com/anderssonarre)" --data-urlencode "data=$Q" "$url" -o /tmp/osm.json -w "%{http_code}")
              echo "$url $code $(head -c 200 /tmp/osm.json | tr '\n' ' ')" >> tools/centrum/hamtlogg.txt
              if [ "$code" = 200 ] && python3 -c "import json;d=json.load(open('/tmp/osm.json'));assert len(d['elements'])>100"; then cp /tmp/osm.json tools/centrum/osm-vasklot.json; break 2; fi
              sleep 20
            done
          done
          cat tools/centrum/hamtlogg.txt
      - name: Spara
        if: always()
        run: |
          git config user.name "kartdata-bot"
          git config user.email "kartdata-bot@users.noreply.github.com"
          git add tools/centrum/
          git commit -m "Kartdata för Vasa centrum från OpenStreetMap (ODbL)"
          git push origin HEAD:kartdata-hamta
